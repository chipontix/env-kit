name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make test
      - if: failure()
        run: docker compose logs postgres api
      - if: always()
        run: make down

  broken:
    # The suite must fail on every variant in broken/, on the tests each
    # patch names, and the tree must come back clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make test-broken
      - name: tree restored
        run: git diff --exit-code -- . ':!results'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-runs
          path: results/broken/
      - if: always()
        run: make down
